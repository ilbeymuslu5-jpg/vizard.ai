<title>Merge &amp; Restore — Willow House</title>
<style>
  /* ---------------------------------------------------------------------
     Merge & Restore — workshop identity.
     One committed visual world (a dim workshop at dusk: walnut, brass and
     blueprint), so the palette is painted explicitly rather than reacting to
     the host theme. Every color is a token; nothing is defined inside a media
     query, so the page renders identically on any ground.
     --------------------------------------------------------------------- */
  :root {
    --ink:        #17130f;  /* deepest ground: walnut shadow            */
    --bench:      #221c16;  /* raised panels                            */
    --slate:      #2b231b;  /* board bed                                */
    --slate-lip:  #3a3025;  /* hairline edges                           */
    --brass:      #c9973f;  /* primary accent: tools, currency, focus   */
    --brass-dim:  #8d6a2c;
    --blueprint:  #6fb3b8;  /* secondary: energy, plans, guides         */
    --paper:      #ede3d2;  /* primary text                             */
    --paper-dim:  #a4937c;  /* secondary text (warm neutral, not grey)  */
    --sap:        #7fa05a;  /* semantic: ready / restored               */
    --rust:       #b4553a;  /* semantic: blocked / empty                */

    /* Level ramp: bone -> brass -> verdigris -> lamplight. Every step is a
       visible jump in both hue and luminance, so level reads before the badge
       does. All ten sit above 4.5:1 on the board bed. */
    --tile-1: #cbb79a;
    --tile-2: #e0c79c;
    --tile-3: #f0c274;
    --tile-4: #ffb64b;
    --tile-5: #ff9a4d;
    --tile-6: #b9c98a;
    --tile-7: #8fd18c;
    --tile-8: #6fd3d8;
    --tile-9: #9fe0ff;
    --tile-10: #fff1c2;

    --display: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    --ui: ui-sans-serif, 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --data: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

    --r: 5px;                /* the house radius: crisp, joinery-like   */
    --gap: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    font-family: var(--ui);
    color: var(--paper);
    background:
      radial-gradient(120% 80% at 50% -10%, #2a2119 0%, rgba(23,19,15,0) 60%),
      repeating-linear-gradient(94deg, rgba(255,255,255,.014) 0 2px, rgba(0,0,0,0) 2px 7px),
      var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 14px 76px; /* room for the toast so it never covers a button */
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* -- header ---------------------------------------------------------- */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }

  .crest__title {
    margin: 0;
    font-family: var(--display);
    font-size: 25px;
    font-weight: 600;
    letter-spacing: .01em;
    line-height: 1.05;
    text-wrap: balance;
  }
  .crest__sub {
    margin: 3px 0 0;
    font-size: 10.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--paper-dim);
  }

  .wallet { display: flex; gap: 7px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 9px 5px 6px;
    background: var(--bench);
    border: 1px solid var(--slate-lip);
    border-radius: var(--r);
    font-family: var(--data);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .chip b { font-weight: 600; }
  .chip--coin b { color: var(--brass); }
  .chip--gem b { color: var(--blueprint); }

  /* -- energy ---------------------------------------------------------- */
  .energy {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 10px;
    padding: 10px 12px;
    background: var(--bench);
    border: 1px solid var(--slate-lip);
    border-radius: var(--r);
  }
  .energy__label {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--paper-dim);
  }
  .energy__count { font-family: var(--data); font-size: 12.5px; letter-spacing: 0; text-transform: none; color: var(--paper); font-variant-numeric: tabular-nums; }
  .energy__count em { font-style: normal; color: var(--paper-dim); }
  .meter {
    grid-column: 1 / -1;
    position: relative; height: 9px;
    background: #191410;
    border: 1px solid var(--slate-lip);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter__fill {
    height: 100%;
    background: linear-gradient(90deg, #35707a, var(--blueprint));
    box-shadow: 0 0 10px rgba(111,179,184,.35);
    transition: width .28s ease;
  }
  /* quarter marks: enough to read the bar as a gauge, few enough to stay calm */
  .meter::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 calc(25% - 1px), rgba(23,19,15,.55) calc(25% - 1px) 25%);
    pointer-events: none;
  }

  /* -- tasks ----------------------------------------------------------- */
  .section-label {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--paper-dim);
    margin-bottom: -6px;
  }
  .tasks { display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 7px 8px 7px 10px;
    background: var(--bench);
    border: 1px solid var(--slate-lip);
    border-left: 2px solid var(--slate-lip);
    border-radius: var(--r);
  }
  .task.is-ready { border-left-color: var(--sap); background: linear-gradient(90deg, rgba(127,160,90,.09), rgba(0,0,0,0) 55%), var(--bench); }
  .task .btn { padding: 7px 11px; }
  .task__lines { display: flex; flex-wrap: wrap; gap: 6px; }
  .req {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 7px 3px 4px;
    background: #191410;
    border: 1px solid var(--slate-lip);
    border-radius: 3px;
    font-family: var(--data); font-size: 11.5px; font-variant-numeric: tabular-nums;
    color: var(--paper-dim);
  }
  .req.is-met { color: var(--sap); border-color: rgba(127,160,90,.45); }
  .req svg { display: block; }
  .task__reward {
    margin-top: 4px;
    font-size: 11px; color: var(--paper-dim);
    font-family: var(--data); font-variant-numeric: tabular-nums;
  }
  .task__reward b { color: var(--brass); font-weight: 600; }
  .task__reward i { font-style: normal; color: var(--blueprint); }

  /* -- buttons --------------------------------------------------------- */
  .btn {
    font-family: var(--ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--paper);
    background: #2f2519;
    border: 1px solid var(--slate-lip);
    border-radius: 3px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .08s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--brass-dim); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .btn--go { background: linear-gradient(180deg, #7fa05a, #5f7c40); border-color: #4d6633; color: #10160b; }
  .btn--quiet { background: transparent; color: var(--paper-dim); }

  /* -- board ----------------------------------------------------------- */
  .boardwrap {
    padding: 9px;
    background:
      linear-gradient(180deg, rgba(111,179,184,.05), rgba(0,0,0,0) 45%),
      #1d1710;
    border: 1px solid var(--slate-lip);
    border-radius: var(--r);
    box-shadow: inset 0 1px 0 rgba(237,227,210,.05), 0 12px 28px -18px #000;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap);
    touch-action: none;
  }
  .cell {
    position: relative;
    aspect-ratio: 1;
    display: grid; place-items: center;
    background: #171209;
    background: rgba(0,0,0,.22);
    border: 1px solid rgba(237,227,210,.055);
    border-radius: 3px;
    padding: 0;
    cursor: default;
  }
  /* Empty sockets get a faint centre mark instead of a dashed outline: the
     board reads as a bench with drilled holes, not as 30 loud dotted boxes. */
  .cell:empty::after {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(111,179,184,.16);
  }
  .cell.is-target { border-color: var(--brass); border-style: solid; background: #2a2116; }
  .cell.is-source { opacity: .35; }

  .tile {
    position: absolute; inset: 2px;
    display: grid; place-items: center;
    color: var(--tile-1);
    background: linear-gradient(180deg, #4a3b2a, #2b2118);
    border: 1px solid color-mix(in srgb, currentColor 55%, transparent);
    border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(237,227,210,.09), 0 2px 6px -3px #000;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .tile::after {
    content: attr(data-level);
    position: absolute; right: 3px; bottom: 1px;
    font-family: var(--data); font-size: 10px; font-weight: 700;
    color: currentColor;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  .tile.is-gen {
    background: linear-gradient(180deg, #5a4526, #302516);
    cursor: pointer;
  }
  .tile.is-gen::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(201,151,63,.35), 0 0 12px -2px rgba(201,151,63,.4);
    pointer-events: none;
  }
  .ghost {
    position: fixed; z-index: 40;
    width: 54px; height: 54px;
    display: grid; place-items: center;
    border-radius: 3px;
    border: 1px solid currentColor;
    background: linear-gradient(180deg, #3d3123, #251d16);
    box-shadow: 0 14px 24px -10px #000;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1.06);
  }

  @keyframes pop { 0% { transform: scale(.62); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @keyframes spawn { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tile.anim-pop { animation: pop .34s cubic-bezier(.2,.9,.3,1.4); }
  .tile.anim-spawn { animation: spawn .22s ease-out; }

  /* -- action bar ------------------------------------------------------ */
  .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .actions .btn { width: 100%; }
  .actions__wide { grid-column: 1 / -1; display: flex; gap: 8px; }
  .actions__wide .btn { flex: 1; }

  /* -- modal ----------------------------------------------------------- */
  .scrim {
    position: fixed; inset: 0; z-index: 50;
    display: none; place-items: center;
    padding: 20px;
    background: rgba(12,9,7,.72);
  }
  .scrim.is-open { display: grid; }
  .sheet {
    width: 100%; max-width: 400px;
    padding: 16px;
    background: var(--bench);
    border: 1px solid var(--slate-lip);
    border-radius: var(--r);
    box-shadow: 0 30px 60px -30px #000;
  }
  .sheet__title { margin: 0 0 3px; font-family: var(--display); font-size: 19px; font-weight: 600; }
  .sheet__note { margin: 0 0 12px; font-size: 12px; color: var(--paper-dim); line-height: 1.5; }
  .rooms { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .room {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 10px;
    background: #191410; border: 1px solid var(--slate-lip); border-radius: 3px;
    font-size: 13px;
  }
  .room__state { font-family: var(--data); font-size: 11px; color: var(--paper-dim); }
  .room.is-done { border-color: rgba(127,160,90,.4); }
  .room.is-done .room__state { color: var(--sap); }

  /* -- toast ----------------------------------------------------------- */
  .toast {
    position: fixed; left: 50%; bottom: 18px; z-index: 60;
    transform: translate(-50%, 10px);
    padding: 9px 14px;
    background: #2f2519;
    border: 1px solid var(--slate-lip);
    border-left: 2px solid var(--brass);
    border-radius: 3px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    max-width: min(90vw, 380px);
  }
  .toast.is-up { opacity: 1; transform: translate(-50%, 0); box-shadow: 0 16px 30px -18px #000; }
  .toast.is-bad { border-left-color: var(--rust); }
  .toast.is-good { border-left-color: var(--sap); }

  .hint {
    font-size: 11.5px; line-height: 1.6; color: var(--paper-dim);
    text-align: center;
    margin: 0;
  }
  .hint b { color: var(--paper); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="crest">
      <h1 class="crest__title">Merge &amp; Restore</h1>
      <p class="crest__sub">Willow House · <span id="progress">0 of 3 restored</span></p>
    </div>
    <div class="wallet">
      <span class="chip chip--coin" title="Coins">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="#c9973f"/><circle cx="12" cy="12" r="5.4" fill="rgba(0,0,0,.28)"/></svg>
        <b id="coins">0</b>
      </span>
      <span class="chip chip--gem" title="Gems">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 3.2 20 10l-8 10.8L4 10z" fill="#6fb3b8"/><path d="M12 3.2 20 10H4z" fill="rgba(255,255,255,.22)"/></svg>
        <b id="gems">0</b>
      </span>
    </div>
  </header>

  <section class="energy" aria-label="Energy">
    <div class="energy__label">
      <span>Energy</span>
      <span class="energy__count"><span id="energyNow">0</span>/<span id="energyMax">100</span> <em id="energyNext"></em></span>
    </div>
    <div class="meter"><div class="meter__fill" id="energyFill" style="width:0%"></div></div>
  </section>

  <div class="section-label"><span>Requests</span><span id="taskCount">3 open</span></div>
  <section class="tasks" id="tasks"></section>

  <section class="boardwrap">
    <div class="board" id="board" aria-label="Merge board"></div>
  </section>

  <p class="hint">Tap a <b>glowing generator</b> to spend energy and make parts. Drag two matching parts together to merge.</p>

  <nav class="actions">
    <div class="actions__wide">
      <button class="btn" id="btnAd" type="button">Watch ad · +30 energy</button>
      <button class="btn" id="btnRefill" type="button">Refill · 25 gems</button>
    </div>
    <button class="btn btn--quiet" id="btnRooms" type="button">Willow House</button>
    <button class="btn btn--quiet" id="btnReset" type="button">Start over</button>
  </nav>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <h2 class="sheet__title" id="sheetTitle">Willow House</h2>
    <p class="sheet__note">Every request you deliver brings back one more corner of the house.</p>
    <div class="rooms" id="rooms"></div>
    <button class="btn" id="btnCloseRooms" type="button" style="width:100%">Close</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
