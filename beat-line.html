<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    /* iOS iframe kaydırma kilidi: sayfa hiçbir koşulda kayamaz */
    position: fixed; inset: 0;
    width: 100%; height: 100%; overflow: hidden;
    background: #010208;
    font-family: "Bahnschrift", "Segoe UI", "Arial Narrow", Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #ver {
    position: absolute; left: 8px; bottom: 6px; z-index: 6;
    font-size: 11px; letter-spacing: 1px; color: rgba(160,220,255,.45);
  }
  #diag {
    position: absolute; left: 8px; bottom: 24px; z-index: 6;
    font: 10px/1.5 monospace; color: rgba(140,230,255,.75);
    text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none;
  }

  /* 9:16 sahne — geniş ekranda ortalanır, yanlarda bant kalır.
     Yazı boyutları sahne genişliğine (em) göre ölçeklenir. */
  #stage {
    position: fixed;
    background: #04060e;
    box-shadow: 0 0 60px rgba(84,241,255,.12);
    border-left: 1px solid rgba(84,241,255,.16);
    border-right: 1px solid rgba(84,241,255,.16);
    overflow: hidden;
  }
  /* DİKKAT: canvas "replaced element" — Safari inset:0 ile esnetmez,
     kendi piksel boyutunda (DPR kat büyük) kalır. width/height şart! */
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; color: #eaf6ff; }
  #score {
    position: absolute; top: 14px; left: 18px;
    font-size: clamp(18px, 5.2em, 34px); font-weight: 700; letter-spacing: 1px;
    text-shadow: 0 0 14px rgba(90,220,255,.5), 0 2px 4px rgba(0,0,0,.8);
  }
  #combo {
    position: absolute; top: 14px; right: 18px;
    font-size: clamp(14px, 4.2em, 26px); font-weight: 700; letter-spacing: 1px;
    color: #ffd76e; text-shadow: 0 0 12px rgba(255,200,90,.6);
  }
  #speed {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    font-size: clamp(12px, 3.6em, 20px); font-weight: 700; letter-spacing: 2px;
    color: rgba(200,240,255,.85); text-shadow: 0 0 10px rgba(120,220,255,.5);
  }
  #lives {
    position: absolute; top: clamp(44px, 11em, 60px); left: 18px;
    font-size: clamp(14px, 4.6em, 24px); font-weight: 700; letter-spacing: 3px;
  }
  #lives .h1 { color: #43e8ff; text-shadow: 0 0 10px rgba(67,232,255,.9); }
  #lives .h2 { color: #ff4fd8; text-shadow: 0 0 10px rgba(255,79,216,.9); }
  #lives .lost { color: #3a4254; text-shadow: none; }
  #runChips {
    position: absolute; top: clamp(72px, 18em, 96px); left: 18px;
    font-size: clamp(13px, 4.2em, 21px); font-weight: 700; letter-spacing: 2px;
    color: #ffd76e; text-shadow: 0 0 10px rgba(255, 210, 110, .6);
  }
  /* Oyun içi "şimdi çalıyor" göstergesi — bilgilendirici, seçilemez
     (parça her oyunda 10 parçadan rastgele atanır). */
  #nowPlaying {
    position: absolute; top: clamp(38px, 9.4em, 52px); left: 50%;
    transform: translateX(-50%);
    font-size: clamp(10px, 3.1em, 15px); font-weight: 700; letter-spacing: 1.5px;
    color: rgba(170, 225, 255, .65); white-space: nowrap;
  }
  #popup {
    position: absolute; top: 20%; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(28px, 11em, 56px); font-weight: 800; font-style: italic;
    letter-spacing: 2px; opacity: 0; white-space: nowrap;
  }
  #popup.perfect { color: #8dff3d; text-shadow: 0 0 18px rgba(120,255,60,.95), 0 0 46px rgba(120,255,60,.5); }
  #popup.good    { color: #5ce9ff; text-shadow: 0 0 18px rgba(90,230,255,.95), 0 0 46px rgba(90,230,255,.5); }
  #popup.miss    { color: #ff5f7a; text-shadow: 0 0 18px rgba(255,95,122,.95), 0 0 46px rgba(255,95,122,.5); }
  #popup.show { animation: pop .7s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translateX(-50%) scale(.5); }
    14% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    26% { transform: translateX(-50%) scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  }

  /* ---------- overlay ekranları ---------- */
  #overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(8,16,36,.25), rgba(2,5,14,.8));
    color: #eaf6ff; text-align: center;

  .hidden { display: none !important; }
  #title {

  #title.dead { color: #ff5f7a; text-shadow: 0 0 24px rgba(255,95,122,.9), 0 0 80px rgba(255,95,122,.4); }
  #sub {

    letter-spacing: 2px; color: #cfeeff; opacity: .95; line-height: 1.6;

  #stats {
    margin-top: 10px; font-size: clamp(16px, 5.4em, 30px); font-weight: 700;
    letter-spacing: 2px; color: #ffe9a8; text-shadow: 0 0 14px rgba(255,210,110,.6);
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* ---------- menü butonları ---------- */
  .btn {
    pointer-events: auto; display: block;
    width: min(270px, 74%); margin: 14px auto 0;
    padding: 13px 20px;
    font: inherit; font-size: clamp(15px, 4.8em, 24px); font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: #eaf6ff; background: rgba(10, 20, 40, .55);

    cursor: pointer;

  }

  /* ---------- menüdeki BEAT PASS mini rozeti ---------- */

    font-size: .78em; font-weight: 700; color: #9fdcff; letter-spacing: 1px;

  /* ---------- BEAT PASS ekranı (ayrı, tam ekran bölüm) ---------- */
  #passScr {

  .mile {

  .mile.unlocked .mile-status { color: #8dff3d; }

  /* ---------- mağaza ---------- */
  #shop {
    position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y;

  #shop h2 {
    font-size: clamp(26px, 9em, 46px); font-weight: 800; font-style: italic;
    letter-spacing: 5px; color: #6df2ff;
    text-shadow: 0 0 18px rgba(90, 230, 255, .8);

  #chipsRow {
    margin: 8px 0 2px; font-size: clamp(15px, 4.8em, 24px); font-weight: 700;
    letter-spacing: 2px; color: #ffd76e; text-shadow: 0 0 12px rgba(255, 210, 110, .6);

  #shop h3 {
    margin: 16px 0 8px; font-size: clamp(13px, 4.2em, 20px); font-weight: 700;
    letter-spacing: 4px; color: #9fdcff;

  .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .card {
    pointer-events: auto; cursor: pointer;
    width: 29%; min-width: 92px; padding: 10px 6px;

  .card:active { transform: scale(.95); }
  .card.sel { border-color: #8dff3d; box-shadow: 0 0 12px rgba(140, 255, 60, .35); }
  .card .sw {

  .card .swl { width: 82%; height: 9px; border-radius: 4px; margin: 12px auto 13px; }
  .card .nm { font-size: clamp(11px, 3.4em, 15px); font-weight: 700; letter-spacing: 1px; }
  .card .pr { font-size: clamp(11px, 3.4em, 15px); margin-top: 4px; color: #ffd76e; font-weight: 700; }
  .card.sel .pr { color: #8dff3d; }
  .card .pr.gem { color: #8be9ff; }

  /* ---------- kasa kutusu ---------- */
  #crateBox {
    width: min(320px, 88%); margin: 14px auto 4px;
    padding: 10px 12px 14px;
    background: linear-gradient(160deg, rgba(40, 18, 66, .7), rgba(14, 8, 30, .8));
    border: 1.5px solid rgba(200, 107, 255, .45); border-radius: 14px;
    box-shadow: 0 0 20px rgba(200, 107, 255, .18);

  #crateBox h3 { margin: 2px 0 6px; color: #d9a8ff; }
  #crateBox .btn { border-color: rgba(200, 107, 255, .6); color: #e8ccff; margin-top: 6px; }
  #crateResult {
    min-height: 22px; margin-top: 10px;
    font-size: clamp(13px, 4.2em, 19px); font-weight: 800; letter-spacing: 1px;

  #crateResult.r-chip { color: #ffd76e; text-shadow: 0 0 10px rgba(255,210,110,.6); }

<script>
(() => {
'use strict';

/* =====================================================================
   BEAT LINE — saf Canvas 2D ritim koşusu.
   Tüm zamanlama WebAudio saatine bağlıdır: köşe pozisyonları beat
   zamanlarından TÜRETİLİR (mesafe = hız × beat zamanı), bu yüzden
   çizgi her köşeye tam bas vuruşu anında ulaşır — %100 senkron.
   ===================================================================== */

// ------------------------------------------------------ sabitler
// BPM/BEAT artık seçili parçaya göre değişir (applyTrack ayarlar).
let BPM  = 120;
let BEAT = 60 / BPM;                // saniye
// Dinamik hız: her başarılı dönüşte artar, tavan 17. Hız yalnızca köşe
// anında değiştiği için her segment SABİT kendi hızıyla koşulur; segment
// uzunlukları o hızla üretildiğinden beat senkronu asla bozulmaz.
// Artış belirgin: ~10 dönüşte fark edilir, ~43 dönüşte tavana dayanır.
const BASE_SPEED = 7.5;
const MAX_SPEED  = 17;
const SPEED_INC  = 0.22;
// k. segmentin hızı (0 = giriş düzlüğü; k dönüş tamamlanmış olur).
function speedForSeg(k) {
  return Math.min(MAX_SPEED, BASE_SPEED + SPEED_INC * k);
}
const PATH_W     = 1.7;             // yol genişliği
const HALF_W     = PATH_W / 2;
const LEAD_BEATS = 4;               // ilk köşeden önceki düz giriş
const HIT_WIN    = 0.16;            // sn — dokunuş kabul penceresi
const PERF_WIN   = 0.06;            // sn — PERFECT penceresi
const BLOCK_H    = 3.2;             // platform bloklarının derinliği

// Ritim vuruş dizisi: köşeler arası beat sayıları (döngüyle tekrar eder).
// Bu dizi hem yolun şeklini hem müzikteki vurgu anlarını belirler.
// ---------- PARÇALAR: 10 parça, tempo 140 BPM'den başlayıp 200 BPM'e kadar
// yükselir. Her parçanın kendi ritim dizisi (= kendi harita düzeni), bas
// hattı, davul stili ve dönüş melodisi vardır — hepsi bu koda özgü,
// sentezlenmiş özgün kalıplardır. Parça SEÇİLEMEZ: her yeni oyunda 10
// parçadan biri rastgele atanır (bkz. reset() / pickRandomTrack()).
// 4+ beat'lik düzlükler HOLD şeridi olur.
const HOLD_MIN_GAP = 4;
const TRACKS = [
  { name: 'NEON RUSH', bpm: 140,
    gaps: [2, 2, 1, 1, 4, 1, 1, 1, 0.5, 0.5, 1, 2, 6, 1, 0.5, 0.5, 2, 1, 1, 4],
    bass: [55, 55, 65.4, 49],                       // A1 A1 C2 G1
    melody: [261.63, 293.66, 329.63, 392.0, 440.0], // C maj pentatonik
    hat: 'norm',  snareBeat: 2, stab: [220, 880] },
  { name: 'MIDNIGHT DRIVE', bpm: 147,
    gaps: [4, 2, 2, 4, 1, 1, 2, 6, 2, 1, 1, 2, 4, 2, 2, 2],
    bass: [43.65, 43.65, 51.91, 58.27],             // F1 F1 G#1 A#1
    melody: [220, 261.63, 293.66, 329.63, 392.0],   // A min pentatonik
    hat: 'sparse', snareBeat: 3, stab: [174.6, 698.5] },
  { name: 'ACID CIRCUIT', bpm: 153,
    gaps: [1, 1, 2, 1, 1, 0.5, 0.5, 1, 2, 1, 1, 1, 4, 1, 0.5, 0.5, 1, 1, 2, 1],
    bass: [61.74, 61.74, 73.42, 82.41],             // B1 B1 D2 E2
    melody: [293.66, 329.63, 369.99, 440.0, 493.88],
    hat: 'dense', snareBeat: 2, stab: [246.9, 987.8] },
  { name: 'COSMOS FLOW', bpm: 160,
    gaps: [4, 4, 2, 6, 2, 2, 4, 2, 1, 1, 4, 2, 2, 4],
    bass: [49, 49, 58.27, 65.41],                   // G1 G1 A#1 C2
    melody: [196, 233.08, 261.63, 293.66, 349.23],
    hat: 'sparse', snareBeat: 2, stab: [196, 784] },
  { name: 'GRID RUNNER', bpm: 167,
    gaps: [2, 1, 1, 2, 1, 1, 4, 1, 1, 0.5, 0.5, 2, 1, 1, 6, 1, 1, 2, 0.5, 0.5],
    bass: [41.2, 41.2, 49, 55],                     // E1 E1 G1 A1
    melody: [329.63, 392.0, 440.0, 493.88, 587.33],
    hat: 'norm',  snareBeat: 1, stab: [233.08, 932.33] },
  { name: 'VAPOR CITY', bpm: 173,
    gaps: [4, 2, 1, 1, 4, 2, 1, 1, 2, 6, 1, 1, 2, 2, 4, 1, 1, 2],
    bass: [32.7, 32.7, 38.89, 43.65],                // C1 C1 D#1 F1
    melody: [261.63, 311.13, 349.23, 392.0, 466.16],
    hat: 'sparse', snareBeat: 3, stab: [174.61, 698.46] },
  { name: 'PULSE REACTOR', bpm: 180,
    gaps: [1, 0.5, 0.5, 1, 1, 2, 1, 0.5, 0.5, 1, 4, 1, 1, 0.5, 0.5, 1, 2, 1, 1, 4],
    bass: [46.25, 46.25, 55, 61.74],                 // F#1 F#1 A1 B1
    melody: [369.99, 440.0, 493.88, 554.37, 659.25],
    hat: 'dense', snareBeat: 2, stab: [261.63, 1046.5] },
  { name: 'CHROME HEART', bpm: 187,

  const step = Math.floor(S.score / 15);
  if (step !== theme.step) {          // 15'in katına ulaşıldı -> yeni hedef renk
    theme.step = step;
    if (step > 0) {

      theme.tgt = n;

  const k = 1 - Math.exp(-2.2 * dt);  // yumuşak geçiş
  for (let i = 0; i < 3; i++) theme.cur[i] += (theme.tgt[i] - theme.cur[i]) * k;

}

// Premium pass: seviye başına +80 elmas -> 100 seviyede toplam 10.000.
const PASS_MAX = 100, PASS_XP = 250;
const GEM_FREE = 20, GEM_PREM = 80;
const PREMIUM_PRICE = 1500;   // çip
// Kademe hediyesi kozmetikler (seviyeye ulaşınca otomatik açılır).
const PASS_MILES = [
  { lvl: 25,  premium: true,  cat: 'skins',  id: 'plazma', label: 'Plazma Kostümü' },
  { lvl: 50,  premium: false, cat: 'acc',    id: 'halka',  label: 'Neon Halka' },
  { lvl: 50,  premium: true,  cat: 'lights', id: 'aurora', label: 'Aurora Işığı' },
  { lvl: 100, premium: true,  cat: 'skins',  id: 'nebula', label: 'Nebula Kostümü' },
];
function passLevel() { return Math.min(PASS_MAX, Math.floor(save.xp / PASS_XP)); }
// Yeni seviyelerin ödüllerini ver; kazanım özet listesi döndürür.
function claimPassLevels() {
  const lvl = passLevel();
  if (lvl <= save.claimedLvl) return [];
  const nLvls = lvl - save.claimedLvl;
  let gems = nLvls * GEM_FREE + (save.premium ? nLvls * GEM_PREM : 0);
  const got = ['+' + gems + ' 💎'];
  save.gems += gems;
  for (const m of PASS_MILES) {
    if (m.lvl > save.claimedLvl && m.lvl <= lvl && (!m.premium || save.premium) &&
        !save.owned[m.cat].includes(m.id)) {
      save.owned[m.cat].push(m.id);
      got.push(m.label);
    }
  }
  save.claimedLvl = lvl;
  return got;
}
// Premium satın alma: geçmiş seviyelerin premium elmasları geriye dönük verilir.
function buyPremium() {
  if (save.premium || save.chips < PREMIUM_PRICE) return false;
  save.chips -= PREMIUM_PRICE;
  save.premium = true;
  save.gems += save.claimedLvl * GEM_PREM;
  for (const m of PASS_MILES) {
    if (m.premium && m.lvl <= save.claimedLvl && !save.owned[m.cat].includes(m.id))
      save.owned[m.cat].push(m.id);
  }
  persist();
  return true;
}

// GERÇEK görünür alan: iOS Safari iframe içinde innerHeight'ı şişirebilir

// (innerWidth/Height, documentElement.client*, visualViewport) ve boyutu
// periyodik olarak da kontrol et.
function viewportSize() {
  const de = document.documentElement;
  let w = innerWidth, h = innerHeight;
  if (de) {
    if (de.clientWidth)  w = Math.min(w, de.clientWidth);
    if (de.clientHeight) h = Math.min(h, de.clientHeight);
  }
  if (window.visualViewport) {
    w = Math.min(w, Math.round(visualViewport.width));
    h = Math.min(h, Math.round(visualViewport.height));
  }
  return { w, h };
}
let lastVW = 0, lastVH = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vp = viewportSize();
  lastVW = vp.w; lastVH = vp.h;
  const winW = vp.w, winH = vp.h;
  const maxW = winH * 9 / 16;
  W = Math.min(winW, Math.round(maxW));
  H = winH;
  stage.style.left = Math.round((winW - W) / 2) + 'px';
  stage.style.top = '0px';
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';
  stage.style.fontSize = (W / 100) + 'px';   // HUD em ölçeği
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ------------------------------------------------------ ses (WebAudio)
let actx = null, master = null;
function initAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.45;
    master.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
}
function osc(type, f0, t, dur, vol, f1) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(t, dur, vol, hp) {
  const n = Math.ceil(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(); s.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
}
// Bas hattı ve davul stili artık seçili parçadan (TR) okunur.

// Sert elektronik kick: 350Hz -> 50Hz anlık pitch düşüşü + klik transienti.
// Klik katmanı, bas frekans üretemeyen telefon hoparlörlerinde bile
// vuruşun "hissedilmesini" sağlar.
function kick(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(350, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.055);
  g.gain.setValueAtTime(1.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.26);
  noise(t, 0.018, 0.5, 2500);          // klik / attack transienti
}

// Tok snare: geniş bantlı gövde + tiz cızırtı + kısa ton gövdesi.
function snare(t) {
  noise(t, 0.18, 0.55, 900);           // ana gövde (daha dolgun, daha yüksek)
  noise(t, 0.06, 0.35, 3200);          // tiz patlama
  osc('triangle', 210, t, 0.09, 0.3, 130); // tonal tok vuruş
}

// ------------------------------------------------------ yol üretimi
// Köşe zamanları beat ızgarasına kilitli; pozisyon = hız × zaman.
let gapIdx = 0;
function genCorners(untilTime) {
  while (S.genT < untilTime) {
    // Bu köşeden SONRAKİ segment, (köşe sırası + 1) dönüş tamamlanmış
    // hızla koşulacak — uzunluk o hızla üretilir ki varış tam beat'e otursun.
    const segIdx = S.corners.length + 1;
    const spd = speedForSeg(segIdx);
    const corner = { t: S.genT, beat: S.genBeat, x: S.genX, z: S.genZ,
                     dirIdx: 1 - S.genDir, spd };
    // Bu köşeye gelen segment uzun bir düzlükse -> HOLD şeridi:
    // basış anı düzlüğe girdikten 1 beat sonra, bırakış tam köşede.
    if (S.genPrevGap >= HOLD_MIN_GAP) {
      corner.hold = { start: S.genT - (S.genPrevGap - 1) * BEAT };
      S.cornerBeats.add(S.genBeat - S.genPrevGap + 1);  // basış beat vurgusu
    }
    S.corners.push(corner);
    S.cornerBeats.add(S.genBeat);
    const gap = GAPS[gapIdx++ % GAPS.length];
    S.genPrevGap = gap;
    const len = gap * BEAT * spd;
    // Bir SONRAKİ köşenin konumu: bu köşeden yeni yönde `len` kadar ileri.
    S.genDir = 1 - S.genDir;
    S.genX += DIR[S.genDir].x * len;
    S.genZ += DIR[S.genDir].z * len;
    S.genBeat += gap;
    S.genT = S.genBeat * BEAT;
  }
}

// Şarkı zamanına göre başın olması gereken yeri köşelerden hesapla.
function headAt(t) {
  let px = 0, pz = 0, pt = 0, dirIdx = 1, spd = speedForSeg(0);
  for (let i = S.next - 1; i >= 0; i--) {   // en son geçilen köşe
    if (S.corners[i].t <= t) {
      const c = S.corners[i];
      px = c.x; pz = c.z; pt = c.t; dirIdx = c.dirIdx; spd = c.spd;
      break;
    }
  }
  const d = spd * (t - pt);
  return { x: px + DIR[dirIdx].x * d, z: pz + DIR[dirIdx].z * d, dirIdx };
}

// ------------------------------------------------------ kamera & projeksiyon
// Kamera: başı çaprazdan, yukarıdan ve hafif arkadan takip eder.
const CAM = { back: 6.2, h: 4.6, ahead: 5.2, fl: 0 };
// Odak uzaklığı: dikey (mobil) ekranda da sahne büyük görünsün diye
// hem kısa kenara hem yüksekliğe göre hesaplanır.
function setFocalLength() {
  CAM.fl = Math.max(Math.min(W, H) * 1.15, H * 0.68);
}
const cam = { x: 0, y: 0, z: 0, fx: 0, fz: 0 };   // fx/fz: kamera odağı
let camA = 0;   // odağın çapraz eksendeki (ileri) konumu — sabit hızla artar
let camP = 0;   // odağın yanal konumu — topu yumuşakça izler
// Sabit bakış yönü tabanı (çapraz + aşağı eğim) — her karede aynı.
let B = null;
function computeBasis() {
  const f = norm3({ x: DIAG.x * (CAM.back + CAM.ahead), y: -CAM.h, z: DIAG.z * (CAM.back + CAM.ahead) });
  const r = norm3(cross3(f, { x: 0, y: 1, z: 0 }));
  const u = cross3(r, f);
  B = { f, r, u };
}
function cross3(a, b) { return { x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x }; }
function norm3(v) { const l = Math.hypot(v.x, v.y, v.z); return { x: v.x/l, y: v.y/l, z: v.z/l }; }
computeBasis();

const NEAR = 0.4;
function view(p) {  // dünya -> kamera uzayı
  const dx = p.x - cam.x, dy = (p.y || 0) - cam.y, dz = p.z - cam.z;
  return {
    x: dx * B.r.x + dy * B.r.y + dz * B.r.z,
    y: dx * B.u.x + dy * B.u.y + dz * B.u.z,
    z: dx * B.f.x + dy * B.f.y + dz * B.f.z,
  };
}
const PROJ_CY = 0.43; // projeksiyon merkezi yukarıda -> top ekranın ~%60'ında
function proj(v) {  // kamera uzayı -> ekran
  const s = CAM.fl / v.z;
  return { x: W / 2 + v.x * s, y: H * PROJ_CY - v.y * s };
}
// Near düzleminde kırpılmış çizgi çiz (grid ve iz için).
function line3(p1, p2) {
  let a = view(p1), b = view(p2);
  if (a.z < NEAR && b.z < NEAR) return false;
  if (a.z < NEAR || b.z < NEAR) {
    const t = (NEAR - a.z) / (b.z - a.z);
    const m = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: NEAR };
    if (a.z < NEAR) a = m; else b = m;
  }
  const A = proj(a), Bp = proj(b);
  ctx.moveTo(A.x, A.y); ctx.lineTo(Bp.x, Bp.y);
  return true;
}
// Çokgeni NEAR düzlemine göre kırpar (Sutherland-Hodgman, tek düzlem).
// Eskiden quad() bir köşe bile NEAR'ın gerisindeyse tüm yüzeyi ATLIYORDU
// (bu yüzden karaktere yakın bloklar bazen hiç çizilmiyor, arkası/zemin
// görünüyordu). Artık yüzey NEAR'da düzgünce kırpılıp yine dolduruluyor
// -> platform HER karede tamamen opak kalır.
function clipNear(vs) {
  const out = [];
  for (let i = 0; i < vs.length; i++) {
    const cur = vs[i], prev = vs[(i - 1 + vs.length) % vs.length];
    const curIn = cur.z >= NEAR, prevIn = prev.z >= NEAR;
    if (curIn !== prevIn) {
      const t = (NEAR - prev.z) / (cur.z - prev.z);
      out.push({ x: prev.x + (cur.x - prev.x) * t, y: prev.y + (cur.y - prev.y) * t, z: NEAR });
    }
    if (curIn) out.push(cur);
  }
  return out;
}
function quad(pts, fill) {  // 4 köşeli yüzey (NEAR'da kırpılır)
  const vs = clipNear(pts.map(view));
  if (vs.length < 3) return;
  const ps = vs.map(proj);
  ctx.beginPath();
  ctx.moveTo(ps[0].x, ps[0].y);
  for (let i = 1; i < ps.length; i++) ctx.lineTo(ps[i].x, ps[i].y);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}

// ------------------------------------------------------ parçacıklar & dekor
function burst(x, z, n, col) {
  for (let i = 0; i < n; i++) {
    S.particles.push({
      x, z, y: 0.1,
      vx: (Math.random() - .5) * 5, vy: Math.random() * 3.4, vz: (Math.random() - .5) * 5,
      life: .5 + Math.random() * .5, col,
    });
  }
}
// Çizim döngüsü paylaşımlıları: beat darbesi ve beat kenarı algısı.
let curBeatP = 0, prevBeatPh = 0;

// Ritim vuruşunda rastgele parlayıp sönen zemin hücreleri.
const gridFlash = [];
function spawnGridFlashes() {
  const cell = 3;
  const cx = Math.round(cam.fx / cell) * cell, cz = Math.round(cam.fz / cell) * cell;
  for (let n = 0; n < 6; n++) {
    gridFlash.push({
      x: cx + (Math.floor(Math.random() * 25) - 12) * cell,
      z: cz + (Math.floor(Math.random() * 25) - 12) * cell,
      life: 0.5 + Math.random() * 0.35,
    });
  }
  while (gridFlash.length > 26) gridFlash.shift();
}
function drawGridFlashes(dt) {
  const cell = 3, y = -BLOCK_H + 0.02;
  for (let i = gridFlash.length - 1; i >= 0; i--) {
    const f = gridFlash[i];
    f.life -= dt;
    if (f.life <= 0) { gridFlash.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(0.45, f.life * 0.8);
    quad([
      { x: f.x, y, z: f.z }, { x: f.x + cell, y, z: f.z },
      { x: f.x + cell, y, z: f.z + cell }, { x: f.x, y, z: f.z + cell },
    ], theme.glow);
  }
  ctx.globalAlpha = 1;
}

// Dönüş anında köşeden yayılan neon efekt halkaları.
const rings = [];
function spawnRing(x, z) {
  rings.push({ x, z, r: HALF_W * 0.6, life: 0.55 });
  if (rings.length > 8) rings.shift();
}
function drawRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const g = rings[i];
    g.life -= dt; g.r += 7.5 * dt;
    if (g.life <= 0) { rings.splice(i, 1); continue; }
    ctx.strokeStyle = theme.glow;
    ctx.globalAlpha = Math.min(1, g.life * 2.4);
    ctx.lineWidth = 2.5;
    ctx.shadowColor = theme.glow; ctx.shadowBlur = 12;
    ctx.beginPath();
    let started = false;
    for (let k = 0; k <= 20; k++) {
      const a = (k / 20) * Math.PI * 2;
      const v = view({ x: g.x + Math.cos(a) * g.r, y: 0.06, z: g.z + Math.sin(a) * g.r });
      if (v.z < NEAR) continue;
      const q = proj(v);
      started ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
      started = true;
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

// Koridoru iki yandan saran NEON DUVARLAR: yatay ışık şeritleri + dikey
// direkler. Kamerayla birlikte akar; haritayı Tron kanyonu gibi çerçeveler.
function drawWalls() {
  const a0 = camA - 12, a1 = camA + 70;
  for (const s of [-1, 1]) {
    const wp = camP + s * 17;
    const bx = PERP.x * wp, bz = PERP.z * wp;
    // yatay neon şeritler (alt: parlak tema, orta: soluk, üst: pembe aksan)
    const strips = [
      [0.35, themeRgba(0.55), 2.6],
      [2.4,  themeRgba(0.26), 1.5],
      [5.0,  'rgba(255,80,190,.5)', 2.2],
    ];
    for (const [h, col, lw] of strips) {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath();
      line3({ x: DIAG.x * a0 + bx, y: -BLOCK_H + h, z: DIAG.z * a0 + bz },
            { x: DIAG.x * a1 + bx, y: -BLOCK_H + h, z: DIAG.z * a1 + bz });
      ctx.stroke();
    }
    // dikey direkler
    ctx.strokeStyle = themeRgba(0.2); ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let a = Math.ceil(a0 / 6) * 6; a < a1; a += 6) {
      line3({ x: DIAG.x * a + bx, y: -BLOCK_H, z: DIAG.z * a + bz },
            { x: DIAG.x * a + bx, y: -BLOCK_H + 5.0, z: DIAG.z * a + bz });
    }
    ctx.stroke();
  }
}

// Boşlukta asılı siberpunk nesneler: low-poly piramitler, neon küpler ve
// dikey ışık sütunları. Gerçek 3B konumda dururlar; çizgi ilerledikçe
// perspektif sayesinde yanından geriye doğru paralaksla akarlar.
const FLOAT_COLS = [null, '#ff4fd8', '#ffb84d', '#c94dff']; // null -> tema rengi
const floaters = [];
for (let i = 0; i < 20; i++) {
  const type = i % 3;   // 0 piramit, 1 küp, 2 ışık sütunu
  floaters.push({
    type,
    along: Math.random() * 100 - 10,
    side: (Math.random() < .5 ? -1 : 1) * (6 + Math.random() * 26),
    y: type === 2 ? 0 : -1 + Math.random() * 9,
    size: type === 2 ? 6 + Math.random() * 9 : .55 + Math.random() * 1.1,
    rot: Math.random() * Math.PI * 2,
    spin: (Math.random() - .5) * 1.2,
    colIdx: i % 4,
  });
}

// Seçili AKSESUARI topun etrafına çiz (ekran uzayında, ucuz primitifler).
function drawAccessory(hp, r, t) {
  const id = save.acc;
  if (id === 'yok') return;
  if (id === 'halka') {                       // dönen neon halka
    ctx.strokeStyle = lightCol(0.8);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(hp.x, hp.y, r * 2.0, r * 0.72, Math.sin(t * 1.4) * 0.5, 0, Math.PI * 2);
    ctx.stroke();
  } else if (id === 'uydu') {                 // iki yörünge uydusu
    for (let k = 0; k < 2; k++) {
      const a = t * 2.6 + k * Math.PI;
      ctx.fillStyle = k ? '#ff7ad0' : '#7de8ff';
      ctx.beginPath();
      ctx.arc(hp.x + Math.cos(a) * r * 2.0, hp.y + Math.sin(a) * r * 0.75, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (id === 'yildiz') {               // tepede süzülen yıldız
    const y = hp.y - r * 2.3 + Math.sin(t * 3) * r * 0.18;
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4 - Math.PI / 2;
      const rr = (k % 2 === 0 ? 0.55 : 0.22) * r;
      const x = hp.x + Math.cos(a) * rr, yy = y + Math.sin(a) * rr;
      k ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
    }
    ctx.closePath(); ctx.fill();
  } else if (id === 'taci') {                 // üç sivri neon taç
    ctx.fillStyle = '#ffd76e';
    for (let k = -1; k <= 1; k++) {
      const bx = hp.x + k * r * 0.62, by = hp.y - r * 1.5;
      ctx.beginPath();
      ctx.moveTo(bx - r * 0.26, by);
      ctx.lineTo(bx + r * 0.26, by);
      ctx.lineTo(bx, by - r * (k === 0 ? 0.85 : 0.6));
      ctx.closePath(); ctx.fill();
    }
  } else if (id === 'elmas') {                // yörüngede dönen elmas
    const a = t * 2.2;
    const x = hp.x + Math.cos(a) * r * 2.1, y = hp.y + Math.sin(a) * r * 0.8;
    ctx.fillStyle = '#8be9ff';
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.34);
    ctx.lineTo(x + r * 0.26, y);
    ctx.lineTo(x, y + r * 0.34);
    ctx.lineTo(x - r * 0.26, y);
    ctx.closePath(); ctx.fill();
  }
}

// 8 köşeli neon küp (telkafes, Y ekseninde döner).
function drawNeonCube(wx, wy, wz, s, a, col) {
  const ca = Math.cos(a), sa = Math.sin(a);
  const P = [];
  for (let vi = 0; vi < 8; vi++) {
    const vx = (vi & 1 ? 1 : -1) * s, vy = (vi & 2 ? 1 : -1) * s, vz = (vi & 4 ? 1 : -1) * s;
    const v = view({ x: wx + vx * ca - vz * sa, y: wy + vy, z: wz + vx * sa + vz * ca });
    if (v.z < NEAR) return;
    P.push(proj(v));
  }
  ctx.globalAlpha = Math.min(1, 26 / view({ x: wx, y: wy, z: wz }).z) * .85;
  ctx.strokeStyle = col; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (const [e1, e2] of [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],[0,4],[1,5],[2,6],[3,7]]) {
    ctx.moveTo(P[e1].x, P[e1].y); ctx.lineTo(P[e2].x, P[e2].y);
  }
  ctx.stroke();
}

// Low-poly piramit (3 taban köşesi + tepe).
function drawPyramid(wx, wy, wz, s, a, col) {
  const P = [];
  for (let k = 0; k < 3; k++) {
    const ang = a + k * (Math.PI * 2 / 3);
    const v = view({ x: wx + Math.cos(ang) * s, y: wy, z: wz + Math.sin(ang) * s });
    if (v.z < NEAR) return;
    P.push(proj(v));
  }
  const apexV = view({ x: wx, y: wy + s * 1.5, z: wz });
  if (apexV.z < NEAR) return;
  const A = proj(apexV);
  ctx.globalAlpha = Math.min(1, 26 / apexV.z) * .85;
  ctx.fillStyle = 'rgba(10,16,30,.55)';
  ctx.beginPath();
  ctx.moveTo(P[0].x, P[0].y); ctx.lineTo(P[1].x, P[1].y); ctx.lineTo(P[2].x, P[2].y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let k = 0; k < 3; k++) {
    const n = (k + 1) % 3;
    ctx.moveTo(P[k].x, P[k].y); ctx.lineTo(P[n].x, P[n].y);   // taban
    ctx.moveTo(P[k].x, P[k].y); ctx.lineTo(A.x, A.y);         // tepeye
  }
  ctx.stroke();
}

// Zeminden yükselen dikey ışık sütunu (beat ile nabız atar).
function drawPillar(wx, wz, h, col) {
  const b = { x: wx, y: -BLOCK_H, z: wz }, tp = { x: wx, y: -BLOCK_H + h, z: wz };
  const inten = 0.55 + 0.45 * curBeatP;
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.12 * inten;
  ctx.lineWidth = 9;
  ctx.beginPath(); if (!line3(b, tp)) { ctx.globalAlpha = 1; return; } ctx.stroke();
  ctx.globalAlpha = 0.6 * inten;
  ctx.lineWidth = 2.2;
  ctx.beginPath(); line3(b, tp); ctx.stroke();
}

// ------------------------------------------------------ müzik zamanlayıcı
function schedule() {
  // Adım zamanları t0 üzerinden hesaplanır: oyun saati (düşüşte) durursa
  // t0 kayar ve beat ızgarası onunla birlikte kayar -> köşe-vuruş
  // senkronu her koşulda korunur.
  const ahead = actx.currentTime + 0.15;
  while (true) {
    const t = S.t0 + S.schedStep * (BEAT / 2);
    if (t >= ahead) break;
    if (t < actx.currentTime - 0.05) { S.schedStep++; continue; } // geciken adımı atla
    const step = S.schedStep;          // 8'lik adımlar (BEAT/2)
    const onBeat = step % 2 === 0;
    const beatNo = step >> 1;
    const stepBeat = step / 2;         // 8'lik çözünürlükte beat no (x.5 dahil)
    if (onBeat) {
      kick(t);                                                   // sert kick
      const bar = beatNo >> 2;
      osc('sawtooth', TR.bass[bar % TR.bass.length], t, 0.24, 0.15); // bas
      if (beatNo % 4 === TR.snareBeat) snare(t);                 // tok snare
      if (TR.hat === 'dense') noise(t, 0.03, 0.07, 7500);        // ekstra tık
    } else {
      // hi-hat yoğunluğu parçaya göre
      if (TR.hat !== 'sparse' || beatNo % 2 === 0) noise(t, 0.04, 0.14, 6500);
    }
    // KÖŞE vurgusu: yarım beat'e düşen köşeler dahil (8'lik ızgara).
    if (S.cornerBeats.has(stepBeat)) {
      osc('square', TR.stab[0], t, 0.12, 0.22);
      osc('sine', TR.stab[1], t, 0.18, 0.2);
    }
    S.schedStep++;
  }
}

const $ = id => document.getElementById(id);
const overlay = $('overlay'), titleEl = $('title'),
      statsEl = $('stats'), earnedEl = $('earned'), runChipsEl = $('runChips'),
      scoreEl = $('score'), comboEl = $('combo'), popupEl = $('popup'),
      speedEl = $('speed'), livesEl = $('lives'),
      menuScr = $('menuScr'), shopScr = $('shop'), passScr = $('passScr'), chipsEl = $('chips'),
      skinGrid = $('skinGrid'), lightGrid = $('lightGrid'), accGrid = $('accGrid'),

      btnCrate = $('btnCrate'), crateResult = $('crateResult');
// Üç ana menü ekranından yalnızca birini gösterir, diğerlerini gizler.
function showScreen(scr) {
  for (const s of [menuScr, shopScr, passScr]) s.classList.toggle('hidden', s !== scr);
  overlay.classList.remove('hidden');
}
const heartEls = livesEl.querySelectorAll('span');

function updateHearts() {
  heartEls.forEach((h, i) => h.classList.toggle('lost', i >= S.lives));
}

// Kalp kaybı: ritmi HİÇ bozmadan devam — köşe kaçtıysa dönüş otomatik
// uygulanır, yanlış dokunuşta dönüş hiç uygulanmaz. Combo ve melodi sıfırlanır.
function loseHeart(msg) {
  S.lives--;
  updateHearts();
  S.combo = 0; comboEl.textContent = '';
  S.shake = 11;
  popupEl.textContent = msg;
  popupEl.className = '';
  void popupEl.offsetWidth;
  popupEl.className = 'show miss';
  osc('sawtooth', 300, actx.currentTime, 0.35, 0.35, 90);
  noise(actx.currentTime, 0.25, 0.25, 700);
}

function reset() {
  S.mode = 'play';
  applyTrack();   // rastgele parça: temposu, ritmi ve sesleri
  $('nowPlaying').textContent = '♪ ' + TR.name + '  ·  ' + TR.bpm + ' BPM';
  S.score = 0; S.combo = 0;
  S.corners.length = 0; S.cornerBeats.clear();
  // Harita her oyunda ritim dizisinin rastgele bir noktasından başlar ->
  // aynı parçada bile her koşu farklı dizilir.
  gapIdx = Math.floor(Math.random() * GAPS.length);
  S.next = 0; S.pending = false;
  S.speed = BASE_SPEED;
  S.holding = false;
  melodyIdx = 0;
  S.genBeat = LEAD_BEATS; S.genX = 0; S.genZ = -LEAD_BEATS * BEAT * BASE_SPEED;
  S.genDir = 1; S.genT = LEAD_BEATS * BEAT; S.genPrevGap = 0;
  S.head = { x: 0, z: 0, y: 0 }; S.dirIdx = 1;
  S.trail = [{ x: 0, z: 0 }];
  S.particles.length = 0; S.shake = 0; S.lastBeatNo = -999;
  theme.cur = [...NEON[0]]; theme.tgt = NEON[0]; theme.step = 0;
  S.t0 = actx.currentTime + 0.12;
  S.schedStep = 0;
  genCorners(20);
  camA = 0; camP = 0;
  cam.fx = 0; cam.fz = 0;
  if (S.schedTimer) clearInterval(S.schedTimer);
  S.schedTimer = setInterval(schedule, 30);
  scoreEl.textContent = 'SKOR: 0'; comboEl.textContent = '';
  speedEl.textContent = 'HIZ x1.00';
  S.runChips = 0; runChipsEl.textContent = '⬡ 0';
  S.lives = 3; updateHearts();
  rings.length = 0;
}

// Düşüş başlat. fatal=false ise kalp gider, top düşer ve KALDIĞI YERDEN
// devam eder (düşüş boyunca oyun saati donar -> senkron bozulmaz).
// kind: 'miss' (köşe kaçtı) | 'early' (yanlış zamanda dokundu) | null (ölüm).
function startFall(fatal, kind) {
  S.mode = 'fall';
  S.holding = false;
  S.fallFatal = fatal;
  S.fallKind = kind;
  S.fallT = 0; S.fallVy = 1.5;
  S.fallDir = DIR[S.dirIdx];
  S.shake = fatal ? 14 : 11;
  vibrate(fatal ? [60, 40, 60] : 50);
  burst(S.head.x, S.head.z, fatal ? 40 : 26, C.accentOrange);
  osc('sawtooth', 400, actx.currentTime, fatal ? 0.7 : 0.5, 0.4, 55);
  noise(actx.currentTime, 0.4, 0.3, 400);
}

function die() { startFall(true, null); }

    premBox.innerHTML = '<button class="btn primary" id="buyPremBtn">★ PREMIUM PASS AL — ⬡ ' +
      PREMIUM_PRICE + '</button>' +
      '<div class="premHint">Seviye başına 💎 ' + GEM_FREE + ' yerine 💎 ' +
      (GEM_FREE + GEM_PREM) + ' kazan. Geçmiş seviyelerinin elmasları ve ödülleri geri verilir.</div>';
    $('buyPremBtn').addEventListener('pointerdown', e => {
      e.stopPropagation();

      else {
        const b = $('buyPremBtn');
        b.style.borderColor = '#ff5f7a'; b.style.color = '#ff5f7a';
        setTimeout(renderPassScreen, 300);
      }
    });
  }

  // Ödül yol haritası: her kademe için GERÇEK sahiplik kontrol edilir
  // (save.owned) — sadece seviye/premium şartını sağlamak yetmez, ödül
  // fiilen claimPassLevels() ile verilmiş olmalı.
  const track = $('milesTrack');
  track.innerHTML = '';
  for (const m of PASS_MILES) {
    const reached = lvl >= m.lvl;
    const owned = save.owned[m.cat].includes(m.id);
    const needsPremium = m.premium && !save.premium;
    const el = document.createElement('div');
    el.className = 'mile' + (owned ? ' unlocked' : '') + (m.premium ? ' prem' : '');

      '<div class="mile-lvl">SEVİYE ' + m.lvl + '</div>' +
      '<div class="mile-name">' + m.label + '</div>' +
      '<div class="mile-status">' + status + '</div>';
    track.appendChild(el);
  }
}

function renderShop() {
  chipsEl.textContent = save.chips;
  $('gems').textContent = save.gems;
  skinGrid.innerHTML = ''; lightGrid.innerHTML = ''; accGrid.innerHTML = '';
  for (const it of SKINS) skinGrid.appendChild(shopCard(it, 'skins'));
  for (const it of LIGHTS) lightGrid.appendChild(shopCard(it, 'lights'));
  for (const it of ACCS) accGrid.appendChild(shopCard(it, 'acc'));
}

function selOf(cat) { return cat === 'skins' ? save.skin : cat === 'lights' ? save.light : save.acc; }
function setSel(cat, id) {
  if (cat === 'skins') save.skin = id;
  else if (cat === 'lights') save.light = id;
  else save.acc = id;
}

function shopCard(it, cat) {
  const owned = save.owned[cat].includes(it.id);
  const selId = selOf(cat);
  const d = document.createElement('div');
  d.className = 'card' + (selId === it.id ? ' sel' : '');
  let sw;
  if (cat === 'skins') {
    const bg = it.core === 'rainbow'
      ? 'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)'
      : Array.isArray(it.core)
        ? 'linear-gradient(135deg,' + it.core[0] + ',' + it.core[1] + ')'
        : it.core;
    const glow = Array.isArray(it.core) ? it.core[0] : (it.core === 'rainbow' ? '#fff' : it.core);
    sw = '<div class="sw" style="background:' + bg + ';color:' + glow + '"></div>';
  } else if (cat === 'lights') {
    const c = swatchCol(it);
    sw = '<div class="swl" style="background:rgba(' + c + ',.95);box-shadow:0 0 12px rgba(' + c + ',.9)"></div>';
  } else {
    const icons = { yok: '&#8709;', halka: '&#9678;', uydu: '&#9737;', yildiz: '&#9733;', taci: '&#9819;', elmas: '&#128142;' };
    sw = '<div class="sw" style="background:#101a30;color:#8be9ff;display:flex;align-items:center;justify-content:center;font-size:20px">' + (icons[it.id] || '?') + '</div>';
  }
  const priceHtml = owned
    ? (selId === it.id ? 'SEÇİLİ' : 'SEÇ')
    : it.src === 'kasa' ? '<span class="kasa">KASADAN</span>'
    : it.gem ? '<span class="gem">💎 ' + it.gem + '</span>'
    : '⬡ ' + it.price;
  d.innerHTML = sw + '<div class="nm">' + it.name + '</div>' +
    '<div class="pr">' + priceHtml + '</div>';
  d.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (owned) {
      setSel(cat, it.id);
    } else if (it.src === 'kasa') {
      d.style.borderColor = '#c86bff';       // yalnızca kasadan çıkar
      setTimeout(renderShop, 300);
      return;
    } else if (it.gem ? save.gems >= it.gem : save.chips >= it.price) {
      if (it.gem) save.gems -= it.gem; else save.chips -= it.price;
      save.owned[cat].push(it.id);
      setSel(cat, it.id);
      vibrate(25);
    } else {
      d.style.borderColor = '#ff5f7a';       // yetersiz bakiye
      setTimeout(renderShop, 260);
      return;
    }
    persist(); renderShop();
  });
  return d;
}

function gameOver() {
  S.mode = 'over';

  S.best = Math.max(S.best, S.score);
  localStorage.setItem('bl_best', S.best);
  // Para: dönüş başına kazanılan çipler (PERFECT 3, GOOD 2).
  save.chips += S.runChips;

  titleEl.textContent = 'OYUN BİTTİ';

// Dokunuş: sıradaki köşenin zaman penceresiyle karşılaştır.
// Ortak başarı yolu: hem normal dokunuş hem hold bırakışı buradan geçer.
function turnSuccess(dt) {
  S.pending = true;                   // dönüş tam köşe anında uygulanacak
  const kind = Math.abs(dt) <= PERF_WIN ? 'perfect' : 'good';
  S.lastKind = kind;
  S.combo++;
  S.score += (kind === 'perfect' ? 3 : 1) * Math.min(S.combo, 10);
  S.runChips += kind === 'perfect' ? 3 : 2;   // para: PERFECT 3, GOOD 2
  runChipsEl.textContent = '⬡ ' + S.runChips;
  showPopup(kind);
  // Melodik dönüş: pentatonik dizinin sıradaki notası (PERFECT'te oktav süsü).
  const f = TR.melody[melodyIdx % TR.melody.length];
  melodyIdx++;
  osc('sine', f, actx.currentTime, 0.22, 0.26);
  if (kind === 'perfect') osc('sine', f * 2, actx.currentTime + 0.04, 0.18, 0.12);
  vibrate(kind === 'perfect' ? 45 : 28);   // dönüş geri bildirimi: titreşim
}

function tap() {
  if (S.mode !== 'play' || S.pending || S.holding) return;
  initAudio();   // iOS: her dokunuşta resume dene (arka plan kesintilerine karşı)
  const c = S.corners[S.next];
  // HOLD şeridi: önce şerit başındaki basış anı değerlendirilir.
  if (c.hold && !c.holdDone) {
    const hdt = S.song - c.hold.start;
    if (Math.abs(hdt) <= HIT_WIN) {
      S.holding = true; c.holdDone = true;   // basış tamam; bırakış köşede
      popupEl.textContent = 'TUT!';
      popupEl.className = '';
      void popupEl.offsetWidth;
      popupEl.className = 'show good';
      vibrate(20);
      return;
    }
  }
  const dt = S.song - c.t;              // -: erken, +: geç
  if (Math.abs(dt) <= HIT_WIN) {
    turnSuccess(dt);
  } else if (S.lives > 1) {
    // Yanlış zamanda dokunuş: kalp git, yanlış dönüşle yoldan uç, düş,
    // sonra kaldığı yerden devam et.
    if (c.hold) c.holdDone = true;      // şerit hakkı yandı, köşe normale döner
    loseHeart('ERKEN DOKUNDUN!');
    S.trail.push({ x: S.head.x, z: S.head.z });
    S.dirIdx = 1 - S.dirIdx;
    startFall(false, 'early');
  } else {
    // Son kalp: çizgi hemen döner ve yoldan çıkar.
    S.trail.push({ x: S.head.x, z: S.head.z });
    S.dirIdx = 1 - S.dirIdx;
    die();
  }
}

// HOLD bırakışı: köşe anına göre değerlendirilir; başarılı bırakış dönüştür.
function release() {
  if (S.mode !== 'play' || !S.holding) return;
  S.holding = false;
  const c = S.corners[S.next];
  const dt = S.song - c.t;
  if (Math.abs(dt) <= HIT_WIN) {
    turnSuccess(dt);
    S.runChips += 1;                    // hold bonusu
    runChipsEl.textContent = '⬡ ' + S.runChips;
  } else if (dt < -HIT_WIN) {
    if (S.lives > 1) {
      loseHeart('ERKEN BIRAKTIN!');
      startFall(false, 'hold');         // düş, kaldığı yerden devam
    } else {
      S.trail.push({ x: S.head.x, z: S.head.z });
      S.dirIdx = 1 - S.dirIdx;
      die();
    }
  }
  // Geç bırakma: köşe kaçırma dalı zaten işler (miss).
}
// Oyun içi dokunuş: yalnızca oyun modunda; menü/mağaza butonları kendi

// ------------------------------------------------------ güncelleme
function update(dt, dtRaw) {
  if (S.mode === 'play') {
    // Hibrit saat: ses motoru çalışıyorsa örnek-hassas ses saati,
    // askıdaysa (iOS sessiz mod vb.) kendi saatimizle akmaya devam et.
    if (actx.state === 'running') {
      S.song = actx.currentTime - S.t0;
    } else {
      S.song += dtRaw;
      S.t0 = actx.currentTime - S.song;   // ses dönünce sıçrama olmasın
    }
    genCorners(S.song + 20);

    // Bas vuruşu anında kamera darbesi: oyun saati beat sınırını geçince
    // (schedule() 150ms önden ses kuyrukladığı için tetik burada — duyulan
    // vuruşla birebir eş zamanlı).
    const beatNo = Math.floor(S.song / BEAT);
    if (beatNo !== S.lastBeatNo) {
      S.lastBeatNo = beatNo;
      if (beatNo >= 0) S.shake = Math.max(S.shake, 4.5);
    }

    const c = S.corners[S.next];
    // HOLD basışı kaçırıldı mı? (şerit başladı, parmak yok)
    if (c.hold && !c.holdDone && !S.holding && S.song > c.hold.start + HIT_WIN) {
      c.holdDone = true;                // köşe normale döner
      if (S.lives > 1) {
        loseHeart('ŞERİDİ KAÇIRDIN!');
        startFall(false, 'hold');
      } else {
        S.next++;
        die();
      }
    }
    if (S.mode === 'play' && S.song >= c.t) {
      if (S.pending) {
        // Tam köşe anında (== bas vuruşu anında) dön.
        S.trail.push({ x: c.x, z: c.z });
        S.dirIdx = c.dirIdx;
        S.speed = c.spd;               // başarılı dönüş: yeni segmentin hızı
        S.next++; S.pending = false;
        burst(c.x, c.z, 22, theme.glow);
        spawnRing(c.x, c.z);           // köşeden yayılan efekt halkası
        if (S.lastKind === 'perfect') burst(c.x, c.z, 16, '#8dff3d'); // yeşil ışıltı
        S.shake = 7;
        scoreEl.textContent = 'SKOR: ' + S.score;
        comboEl.textContent = S.combo > 1 ? 'COMBO x' + Math.min(S.combo, 10) : '';
        speedEl.textContent = 'HIZ x' + (S.speed / BASE_SPEED).toFixed(2);
      } else if (S.song > c.t + HIT_WIN) {
        if (S.lives > 1) {
          // Köşe kaçtı: kalp git, top DÜŞSÜN, sonra kaldığı yerden devam.
          loseHeart('CAN GİTTİ!');
          startFall(false, 'miss');   // dönüş respawn'da uygulanacak
        } else {
          // Son kalp: düz devam -> yoldan çık -> düş -> oyun biter.
          S.next++;         // izleyen mantık bozulmasın
          die();
        }
      }
    }
    if (S.mode === 'play') {
      const h = headAt(Math.min(S.song, S.pending ? S.corners[S.next].t : S.song));
      // pending iken köşeyi geçmiş olamayız (yukarıda işlendi); normal akış:
      S.head.x = h.x; S.head.z = h.z;
    }
  } else if (S.mode === 'fall') {
    S.fallT += dt;
    S.fallVy -= 14 * dt;
    S.head.y += S.fallVy * dt;
    S.head.x += S.fallDir.x * S.speed * 0.45 * dt;
    S.head.z += S.fallDir.z * S.speed * 0.45 * dt;
    // Oyun saati düşüş boyunca DONUK: t0'ı kaydırarak eşlemeyi koru.
    // Müzik zamanlayıcısı t0'dan beslendiği için beat ızgarası da
    // toplamda aynı miktar kayar -> devamda senkron birebir korunur.
    S.t0 = actx.currentTime - S.song;
    if (S.fallT > (S.fallFatal ? 1.0 : 0.7)) {
      if (S.fallFatal) { gameOver(); }
      else {
        // KALDIĞI YERDEN DEVAM: baş, donuk şarkı zamanındaki gerçek
        // ray konumuna geri oturtulur.
        if (S.fallKind === 'miss') {
          const c = S.corners[S.next];
          S.trail.push({ x: c.x, z: c.z });   // kaçan dönüş şimdi uygulanır
          S.dirIdx = c.dirIdx;
          S.speed = c.spd;
          S.next++;
        } else if (S.fallKind === 'early') {
          S.trail.pop();                       // yanlış dönüş izini geri al
        }
        const h = headAt(S.song);
        S.head.x = h.x; S.head.z = h.z; S.head.y = 0;
        S.dirIdx = h.dirIdx;
        S.fallVy = 0;
        S.mode = 'play';
        spawnRing(S.head.x, S.head.z);
        burst(S.head.x, S.head.z, 14, theme.glow);
        vibrate(30);
      }
    }
  }

  // parçacıklar
  for (let i = S.particles.length - 1; i >= 0; i--) {
    const p = S.particles[i];
    p.life -= dt;
    if (p.life <= 0) { S.particles.splice(i, 1); continue; }
    p.vy -= 6 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
  }
  S.shake *= Math.pow(0.001, dt); // hızlı sönüm

  // KAMERA: topa kilitlenmez, haritada dümdüz akar.
  // İleri (çapraz) eksende hız sabittir ve doğrudan şarkı zamanından
  // türetilir -> sıfır sarsıntı. Yanal eksende top yumuşak bir yayla
  // izlenir -> top ekranın orta-altında hafifçe salınır.
  // Yanal takip GERÇEK geçen süreyle hesaplanır (dtRaw): kare hızı düşse
  // bile top geride kalmaz. Ek sigorta: top merkezden en fazla 2.1 birim
  // uzaklaşabilir — asla ekran dışına çıkamaz.
  const headPerp = (S.head.x + S.head.z) * Math.SQRT1_2;
  // Yanal takip sertliği hızla ölçeklenir -> gecikme her hızda ~sabit kalır.
  camP += (headPerp - camP) * (1 - Math.exp(-(3.0 * S.speed / BASE_SPEED) * dtRaw));
  const lag = headPerp - camP, MAX_LAG = 2.1;
  if (Math.abs(lag) > MAX_LAG) camP = headPerp - Math.sign(lag) * MAX_LAG;
  // İleri eksen: topun çapraz izdüşümü (hız değişken olsa da süreklidir).
  if (S.mode === 'play') camA = S.head.x * DIAG.x + S.head.z * DIAG.z;
  cam.fx = DIAG.x * camA + PERP.x * camP;
  cam.fz = DIAG.z * camA + PERP.z * camP;
  cam.x = cam.fx - DIAG.x * CAM.back;
  cam.z = cam.fz - DIAG.z * CAM.back;
  cam.y = CAM.h;
  setFocalLength();
}

// ------------------------------------------------------ çizim
function drawGrid(pulse) {
  const cell = 3, n = 26;
  const cx = Math.round(cam.fx / cell) * cell, cz = Math.round(cam.fz / cell) * cell;
  // Bas vuruşunda parla, vuruş geçtikçe sönümlen.
  ctx.strokeStyle = themeRgba(0.26 + 0.42 * pulse, 0.85);
  ctx.lineWidth = 1 + pulse * 0.9;
  ctx.beginPath();
  for (let i = -n; i <= n; i++) {
    line3({ x: cx + i * cell, y: -BLOCK_H, z: cz - n * cell }, { x: cx + i * cell, y: -BLOCK_H, z: cz + n * cell });
    line3({ x: cx - n * cell, y: -BLOCK_H, z: cz + i * cell }, { x: cx + n * cell, y: -BLOCK_H, z: cz + i * cell });
  }
  ctx.stroke();
}

function drawFloaters(t) {
  const headAlong = S.head.x * DIAG.x + S.head.z * DIAG.z;
  // Dünya ritimle nefes alır: vuruş anında hafif büyür, üssel eğriyle söner.
  const breathe = 1 + 0.16 * curBeatP;
  for (const f of floaters) {
    // Geride kalan nesneyi ileriye taşı -> sonsuz paralaks akışı.
    if (f.along - headAlong < -16) f.along += 110;
    const wx = DIAG.x * f.along - DIAG.z * f.side;
    const wz = DIAG.z * f.along + DIAG.x * f.side;
    const col = f.colIdx === 0 ? theme.glow : FLOAT_COLS[f.colIdx];
    const a = f.rot + t * f.spin;
    if (f.type === 2) drawPillar(wx, wz, f.size, col);
    else if (f.type === 1) drawNeonCube(wx, f.y, wz, f.size * breathe, a, col);
    else drawPyramid(wx, f.y, wz, f.size * breathe, a, col);
  }
  ctx.globalAlpha = 1;
}

// Yolun bir koşusunu (iki köşe arası dikdörtgen blok) çiz.
function drawRun(x1, z1, x2, z2, dirIdx) {
  const d = DIR[dirIdx];
  const px = -d.z, pz = d.x;                    // dik (perp) vektör
  const ex = d.x * HALF_W, ez = d.z * HALF_W;   // uçlara yarım genişlik uzat
  const ax = x1 - ex, az = z1 - ez, bx = x2 + ex, bz = z2 + ez;
  const c1 = { x: ax + px * HALF_W, z: az + pz * HALF_W };
  const c2 = { x: bx + px * HALF_W, z: bz + pz * HALF_W };
  const c3 = { x: bx - px * HALF_W, z: bz - pz * HALF_W };
  const c4 = { x: ax - px * HALF_W, z: az - pz * HALF_W };
  // TÜM yan yüzler + uç kapaklar: yol tamamen OPAK, köşelerden ve
  // uçlardan arkası asla görünmez.
  const sideFaces = [
    [c1, c2], [c4, c3],   // iki uzun kenar
    [c1, c4], [c2, c3],   // uç kapaklar
  ];
  for (const [p, q] of sideFaces) {
    quad([
      { x: p.x, y: 0, z: p.z }, { x: q.x, y: 0, z: q.z },
      { x: q.x, y: -BLOCK_H, z: q.z }, { x: p.x, y: -BLOCK_H, z: p.z },
    ], dirIdx === 0 ? C.side : C.side2);
  }
  // Üst yüz: koyu siber gri/siyah
  quad([
    { x: c1.x, y: 0, z: c1.z }, { x: c2.x, y: 0, z: c2.z },
    { x: c3.x, y: 0, z: c3.z }, { x: c4.x, y: 0, z: c4.z },
  ], C.top);

  // Neon kenarlar: koşu boyunca iki üst kenar (kaydırma hilesi ile
  // ardışık koşular tek sürekli kontur oluşturur). Kalın ve yoğun parlama.
  ctx.strokeStyle = theme.glow;
  ctx.shadowColor = theme.glow;
  ctx.shadowBlur = 24;
  ctx.lineWidth = 3.4;
  ctx.beginPath();
  for (const s of [1, -1]) {
    const shift = s * HALF_W * (dirIdx === 0 ? 1 : -1);
    line3(
      { x: x1 + px * s * HALF_W + d.x * shift, y: 0.02, z: z1 + pz * s * HALF_W + d.z * shift },
      { x: x2 + px * s * HALF_W + d.x * shift, y: 0.02, z: z2 + pz * s * HALF_W + d.z * shift });
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

let lastErr = '', errCount = 0, ballScr = { x: 0, y: 0 };

function draw(t) {
  // Çizim matrisi her karede sıfırlanır: bir hata restore'u atlasa bile
  // dönüşümler birikip sahneyi kaydıramaz.
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // arka plan
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#04060e');
  bg.addColorStop(.55, '#071224');
  bg.addColorStop(1, '#04060e');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // ekran titremesi
  ctx.save();
  if (S.shake > 0.3) ctx.translate((Math.random() - .5) * S.shake, (Math.random() - .5) * S.shake);

  // Beat darbesi: vuruş anında 1'e FIRLAR, üssel olarak çok hızlı söner.
  // (0.003^faz: fazın %25'inde ~%23'e, yarısında ~%5'e düşer — sert punch.)
  const tSrc = (S.mode === 'play' || S.mode === 'fall') ? S.song : t;
  const ph = (((tSrc / BEAT) % 1) + 1) % 1;
  const beatP = Math.pow(0.003, ph);
  curBeatP = beatP;
  if (ph < prevBeatPh) spawnGridFlashes();   // yeni vuruş -> zemin hücreleri
  prevBeatPh = ph;
  drawGrid(beatP);
  drawGridFlashes(1 / 60);
  drawWalls();
  drawFloaters(t);

  // yol koşuları: uzaktan yakına
  const segs = [];
  let px = 0, pz = 0, pdir = 1;
  for (let i = 0; i < S.corners.length; i++) {
    const c = S.corners[i];
    segs.push([px, pz, c.x, c.z, pdir]);
    px = c.x; pz = c.z; pdir = c.dirIdx;
  }
  segs.push([px, pz, px + DIR[pdir].x * 30, pz + DIR[pdir].z * 30, pdir]);
  const headAlong = S.head.x * DIAG.x + S.head.z * DIAG.z;
  for (let i = segs.length - 1; i >= 0; i--) {
    const sg = segs[i];
    const far = sg[2] * DIAG.x + sg[3] * DIAG.z;
    if (far - headAlong < -CAM.back + 1.5) continue;   // kamera arkasında
    if ((sg[0] * DIAG.x + sg[1] * DIAG.z) - headAlong > 60) continue; // çok uzak
    drawRun(sg[0], sg[1], sg[2], sg[3], sg[4]);
  }

  drawRings(1 / 60);

  // HOLD şeritleri: uzun düzlüklerde parlak neon şerit (basılıyken beyaz yanar).
  for (let i = Math.max(1, S.next); i < Math.min(S.next + 3, S.corners.length); i++) {
    const c = S.corners[i];
    if (!c.hold) continue;
    if (c.holdDone && !(S.holding && i === S.next)) continue;
    const p = S.corners[i - 1];
    const hd = DIR[p.dirIdx];
    const hs = { x: p.x + hd.x * p.spd * (c.hold.start - p.t),
                 z: p.z + hd.z * p.spd * (c.hold.start - p.t) };
    const active = S.holding && i === S.next;
    ctx.strokeStyle = active ? '#ffffff' : themeRgba(0.55);
    ctx.lineWidth = active ? 7 : 5;
    ctx.lineCap = 'round';
    ctx.shadowColor = theme.glow; ctx.shadowBlur = active ? 20 : 12;
    ctx.beginPath();
    line3({ x: hs.x, y: 0.08, z: hs.z }, { x: c.x, y: 0.08, z: c.z });
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Basış anı halkası: şeridin başında, vuruşa senkron daralır.
    if (!c.holdDone && i === S.next && S.mode === 'play') {
      const left = c.hold.start - S.song;
      if (left < BEAT * 2.5) {
        const phh = Math.max(0, left) / (BEAT * 2.5);
        const R = HALF_W * (0.55 + phh * 2.6);
        const inWin = Math.abs(left) <= HIT_WIN;
        ctx.strokeStyle = inWin ? '#ffffff' : themeRgba(0.8);
        ctx.globalAlpha = inWin ? 1 : 0.7;
        ctx.lineWidth = inWin ? 4 : 2.5;
        ctx.beginPath();
        let st = false;
        for (let k = 0; k <= 20; k++) {
          const a = (k / 20) * Math.PI * 2;
          const v = view({ x: hs.x + Math.cos(a) * R, y: 0.06, z: hs.z + Math.sin(a) * R });
          if (v.z < NEAR) continue;
          const q = proj(v);
          st ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
          st = true;
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  // iz (çizginin kendisi): dönüş noktaları + baş.
  // İki geçiş: geniş pembe aura + parlak çekirdek (asset setindeki kuyruk).
  const pts = [...S.trail, { x: S.head.x, z: S.head.z }];
  for (const pass of [0, 1]) {
    ctx.strokeStyle = pass === 0 ? lightCol(0.30) : C.trail;
    ctx.shadowColor = pass === 0 ? lightCol(0.9) : theme.glow;
    ctx.shadowBlur = pass === 0 ? 18 : 16;
    ctx.lineWidth = pass === 0 ? 10 : 5;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < pts.length - 1; i++) {
      line3({ x: pts[i].x, y: 0.12, z: pts[i].z }, { x: pts[i+1].x, y: 0.12, z: pts[i+1].z });
    }
    // düşüşte başın dikey çizgisi
    if (S.mode === 'fall')
      line3({ x: S.head.x, y: 0.12, z: S.head.z }, { x: S.head.x, y: S.head.y, z: S.head.z });
    ctx.stroke();
  }

  // Sıradaki köşede beat'e senkron daralan HEDEF HALKASI:
  // vuruş yaklaştıkça halka köşeye iner, pencere içindeyken beyaza döner.
  if (S.mode === 'play' && S.corners[S.next]) {
    const c = S.corners[S.next];
    const left = c.t - S.song;                  // vuruşa kalan süre
    if (left < BEAT * 2.5) {
      const ph = Math.max(0, left) / (BEAT * 2.5);
      const R = HALF_W * (0.55 + ph * 2.6);
      const inWin = Math.abs(left) <= HIT_WIN;
      ctx.strokeStyle = inWin ? '#ffffff' : theme.glow;
      ctx.globalAlpha = inWin ? 1 : 0.75 * (1 - ph * 0.6);
      ctx.lineWidth = inWin ? 4 : 2.5;
      ctx.shadowColor = theme.glow; ctx.shadowBlur = inWin ? 18 : 10;
      ctx.beginPath();
      for (let i = 0; i <= 20; i++) {
        const a = (i / 20) * Math.PI * 2;
        const wp = { x: c.x + Math.cos(a) * R, y: 0.06, z: c.z + Math.sin(a) * R };
        const v = view(wp);
        if (v.z < NEAR) continue;
        const q = proj(v);
        i === 0 ? ctx.moveTo(q.x, q.y) : ctx.lineTo(q.x, q.y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }
  }

  // TOP: iri, beat ile nabız atan parlak küre.
  // GARANTİ: projeksiyon ne derse desin top ekran içine kenetlenir —
  // herhangi bir platform/viewport tuhaflığında bile daima görünür.
  {
    const hv = view({ x: S.head.x, y: (S.mode === 'fall' ? S.head.y : 0.16), z: S.head.z });
    const ok = hv.z > NEAR;
    const hp = ok ? proj(hv) : { x: W / 2, y: H * 0.6 };
    hp.x = Math.min(W - 34, Math.max(34, hp.x));
    hp.y = Math.min(H * 0.86, Math.max(H * 0.15, hp.y));
    const beatPulse = 1 + 0.34 * beatP;   // top da aynı sert darbe eğrisiyle büyür
    let r = Math.max(10, (CAM.fl / Math.max(1.5, ok ? hv.z : 7.4)) * 0.34 * beatPulse);
    if (!isFinite(hp.x) || !isFinite(hp.y) || !isFinite(r)) {
      hp.x = W / 2; hp.y = H * 0.6; r = 22;
    }
    ballScr.x = hp.x; ballScr.y = hp.y;
    const grad = ctx.createRadialGradient(hp.x, hp.y, 0, hp.x, hp.y, r * 2.2);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.35, 'rgba(235,250,255,.85)');
    grad.addColorStop(0.7, themeRgba(0.25));
    grad.addColorStop(1, themeRgba(0));
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(hp.x, hp.y, r * 2.2, 0, Math.PI * 2); ctx.fill();

    // KARAKTERİN ARKASINDAN ÇIKAN IŞIK: seçili ışık renginde, geriye doğru
    // sönümlenen huzme (mağazadan değiştirilebilir).
    const bd = DIR[S.dirIdx];
    const tailLen = 1.5 + S.speed * 0.12;
    const tv = view({ x: S.head.x - bd.x * tailLen, y: 0.16, z: S.head.z - bd.z * tailLen });
    if (tv.z > NEAR) {
      const tp = proj(tv);
      const lg = ctx.createLinearGradient(hp.x, hp.y, tp.x, tp.y);
      lg.addColorStop(0, lightCol(0.8));
      lg.addColorStop(1, lightCol(0));
      ctx.strokeStyle = lg;
      ctx.lineCap = 'round';
      ctx.lineWidth = r * 1.5;
      ctx.beginPath(); ctx.moveTo(hp.x, hp.y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
    }

    // KARAKTER: parlak yuvarlak top — kostüm renginde çekirdek + hale + halka.
    ctx.fillStyle = skinCore(t, hp, r);
    ctx.shadowColor = theme.glow; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(hp.x, hp.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hp.x, hp.y, r * 1.55, 0, Math.PI * 2); ctx.stroke();
    drawAccessory(hp, r, t);
  }
  ctx.shadowBlur = 0;

  // parçacıklar
  for (const p of S.particles) {
    const v = view(p);
    if (v.z < NEAR) continue;
    const q = proj(v);
    const r = Math.max(0.6, (CAM.fl / v.z) * 0.045) * (p.life * 2);
    ctx.globalAlpha = Math.min(1, p.life * 2.2);
    ctx.fillStyle = p.col;
    ctx.fillRect(q.x - r, q.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ------------------------------------------------------ ana döngü
let last = performance.now();
const diagEl = document.getElementById('diag');
const diagOn = location.hash === '#debug';
if (!diagOn) diagEl.style.display = 'none';
let diagT = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const dtRaw = Math.min(0.3, (now - last) / 1000);
  const dt = Math.min(0.05, dtRaw);
  last = now;
  try {
    if (actx && (S.mode === 'play' || S.mode === 'fall')) update(dt, dtRaw);
    else {
      // menüde hafif süzülen kamera
      cam.x = -DIAG.x * CAM.back; cam.z = -DIAG.z * CAM.back; cam.y = CAM.h;
      setFocalLength();
      if (!S.corners.length) genCorners(20);
    }
    updateTheme(dt);
    draw(now / 1000);
  } catch (e) {
    errCount++;
    lastErr = (e && e.message) ? e.message.slice(0, 60) : String(e).slice(0, 60);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  // Teşhis paneli (yalnızca #debug ile görünür).
  if (diagOn && now - diagT > 250) {
    diagT = now;
    diagEl.textContent =
      'W:' + W + ' H:' + H + ' dpr:' + DPR +
      ' | top:' + Math.round(ballScr.x) + ',' + Math.round(ballScr.y) +
      '\nmod:' + S.mode + ' t:' + S.song.toFixed(1) +
      ' camA:' + camA.toFixed(1) + ' camP:' + camP.toFixed(1) +
      (errCount ? '\nERR(' + errCount + '): ' + lastErr : '');
  }
}
requestAnimationFrame(frame);

showMenu();   // açılışta ana menü

// Test kancası (#debug ile aç): otomatik oynatma ve durum erişimi.
// BEAT/BPM/TR parçaya göre değiştiği için canlı getter olarak dışa aktarılır.
if (location.hash === '#debug') window.BL = { S, tap, release, headAt, HIT_WIN,
  view, proj, cam, CAM, TRACKS, get camA() { return camA; }, get camP() { return camP; },
  get BEAT() { return BEAT; }, get BPM() { return BPM; }, get TR() { return TR; } };
})();
</script>
</body>
